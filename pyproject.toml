[project]
name = "a1-cost-tracker"
version = "0.1.0"
description = "Send one prompt to Gemini and Groq, then compare tokens, latency, and USD cost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
